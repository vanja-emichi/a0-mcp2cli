name: mcp2cli
title: MCP2CLI
description: Token-efficient CLI bridge to any MCP server. Lets agents discover and call tools on any configured MCP server (stdio or HTTP) without loading all schemas into context. Saves 96-99% of tokens vs native MCP tool injection.
version: 1.1.0
per_project_config: true
per_agent_config: true
always_enabled: false
mcp_native_tools: suppress
settings_sections:
  - agent
